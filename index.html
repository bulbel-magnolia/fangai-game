<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>防癌人生分支簿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 站点顶栏 (随页面切换文案) -->
    <div class="site-header" id="site-header">
      <div class="site-header-inner" id="site-header-inner"></div>
    </div>

    <!-- 顶部进度条 -->
    <div class="topbar" id="topbar" hidden>
      <div class="topbar-inner">
        <span class="topbar-route" id="topbar-route"></span>
        <div class="topbar-progress">
          <span id="topbar-step"></span>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <button class="topbar-restart" id="restart-btn" title="重新开始" aria-label="重新开始">↻</button>
      </div>
    </div>

    <main class="page" id="page">
      <!-- 屏幕由 JS 注入 -->
    </main>
  </div>

  <!-- 二维码库 (本地, 无需网络) -->
  <script src="lib/qrcode.min.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
